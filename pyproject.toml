[project]
name = "flight-tracker"
version = "1.0.0"
description = "Automated flight price tracker with Telegram alerts"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Cesar Palacio", email = "cesarpalaciodev@email.com" }
]
license = { text = "MIT" }
keywords = ["flight", "tracker", "telegram", "alert", "price"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
docker = [
    "gunicorn>=21.0.0",
]
prometheus = [
    "prometheus-client>=0.20.0",
]
dashboard = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.scripts]
flight-tracker = "main:main"

[project.urls]
Homepage = "https://github.com/cesarpalaciodev/flight-tracker-bot"
Documentation = "https://github.com/cesarpalaciodev/flight-tracker-bot#readme"
Repository = "https://github.com/cesarpalaciodev/flight-tracker-bot"
Issues = "https://github.com/cesarpalaciodev/flight-tracker-bot/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "tests/",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "requests.*"
ignore_missing = true

[[tool.mypy.overrides]]
module = "dotenv.*"
ignore_missing = true

[[tool.mypy.overrides]]
module = "prometheus.*"
ignore_missing = true

[tool.ruff]
target-version = "py310"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "C",     # flake8-comprehensions
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
    "UP007",  # Use X | Y for Union
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["F401", "B008"]