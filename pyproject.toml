[project]
name = "flight-tracker"
version = "2.0.0"
description = "Multi-destination flight price tracker with Telegram alerts, Dashboard, CLI commands, caching, and database"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Cesar Palacio", email = "cesarpalaciodev@email.com" }
]
license = { text = "MIT" }
keywords = ["flight", "tracker", "telegram", "alert", "price", "dashboard"]

[project.scripts]
flight-tracker = "main:main"
flight-tracker-dashboard = "main_dashboard:main"

[project.urls]
Homepage = "https://github.com/cesarpalaciodev/flight-tracker-bot"
Repository = "https://github.com/cesarpalaciodev/flight-tracker-bot"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short", "--cov=src", "--cov-report=term-missing"]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 120
lint.select = ["E", "W", "F", "I", "C", "B", "UP", "RUF"]
lint.ignore = ["E501", "B008", "C901", "UP007"]
lint.per-file-ignores."__init__.py" = ["F401"]