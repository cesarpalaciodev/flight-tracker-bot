# Render Deployment - https://render.com

services:
  - type: web
    name: flight-tracker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main_24_7.py
    healthCheckPath: /health
    envVars:
      - key: IGNAV_API_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DATABASE_URL
        value: sqlite:///data/flight_tracker.db
      - key: REDIS_URL
        sync: false

  - type: web
    name: flight-tracker-dashboard
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.dashboard:app --host 0.0.0.0 --port 10000
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///data/flight_tracker.db