name: CI - Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  TOKEN: ${{ secrets.TOKEN || 'test_token_123' }}
  ADMIN_ID: ${{ secrets.ADMIN_ID || 'admin_test_789' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-glob: "requirements*.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy ruff pytest pytest-cov pytest-asyncio pytest-env

      - name: Run ruff linting
        run: ruff check src/ tests/ main*.py --output-format=github

      - name: Run mypy
        run: |
          mypy src/ --ignore-missing-imports --no-warn-unused-ignores --no-strict-optional --follow-imports=normal 2>&1 | head -100

      - name: Run pytest with coverage
        run: |
          pytest \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=60 \
            -v \
            -o "filterwarnings=ignore::DeprecationWarning" \
            tests/
        env:
          TOKEN: test_token_ci
          ADMIN_ID: admin_ci_789

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: github.event_name == 'push' && matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}