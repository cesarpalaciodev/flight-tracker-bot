version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Bogota"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Bogota"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Bogota"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "docker"
      include: "scope"

labels:
  - "dependencies"
  - "automerge"
  - "security"

reviewers:
  - "cesarpalaciodev"

allow:
  - dependency-name: "requests"
    update-types: ["minor", "patch"]
  - dependency-name: "python-dotenv"
    update-types: ["minor", "patch"]
  - dependency-name: "pydantic"
    update-types: ["minor", "patch"]